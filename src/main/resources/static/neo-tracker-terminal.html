<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Tracker</title>

    <style>
        /* ================================================================
           STYLING — dark "mission terminal": black background, green text,
           faint scanlines, blinking cursor, and fade-in rows.
           ================================================================ */
        :root {
          --green: #33ff66; --green-dim: #1c9c3e; --amber: #ffb000; --bg: #050805;
        }
        body {
          background: var(--bg); color: var(--green); font-family: monospace;
          max-width: 960px; margin: 0 auto; padding: 20px;
          text-shadow: 0 0 4px rgba(51, 255, 102, 0.4);
        }
        /* Scanline overlay: thin faint lines over the whole page. */
        body::before {
          content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
          pointer-events: none;
          background: repeating-linear-gradient(to bottom,
            rgba(51,255,102,0.03) 0px, rgba(51,255,102,0.03) 1px,
            transparent 1px, transparent 3px);
        }
        h1 { border-bottom: 1px solid var(--green); padding-bottom: 10px; letter-spacing: 2px; }
        /* Blinking cursor. */
        .cursor {
          display: inline-block; width: 10px; height: 18px; background: var(--green);
          vertical-align: middle; animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        /* Tab buttons. */
        .tabs { margin: 20px 0; }
        .tab-button {
          background: #111; color: var(--green-dim); border: 1px solid var(--green-dim);
          font-family: monospace; padding: 8px 16px; cursor: pointer;
          text-transform: uppercase; letter-spacing: 1px;
        }
        .tab-button.active { color: var(--green); border-color: var(--green); }
        .tab-content { display: none; }
        .tab-content.visible { display: block; }
        /* Inputs, dropdowns, buttons. */
        input, button, select {
          background: #111; color: var(--green); border: 1px solid var(--green);
          font-family: monospace; padding: 6px 10px;
        }
        button { cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        /* Solid-green hover for ACTION buttons only (Fetch, Inspect, etc.) --
           the :not(.tab-button) stops it applying to the tab buttons. */
        button:not(.tab-button):hover { background: var(--green); color: var(--bg); text-shadow: none; }
        /* Tab buttons get a subtler hover: just brighten the text and border,
           no solid fill (which would hide the label). */
        .tab-button:hover { color: var(--green); border-color: var(--green); }
        .controls { margin: 20px 0; }
        .filters { margin: 15px 0; color: var(--green-dim); }
        #status, #qualityStatus { margin: 15px 0; color: var(--green-dim); min-height: 18px; }
        /* Results table. */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--green-dim); padding: 8px; text-align: left; font-size: 13px; }
        th { color: var(--green-dim); text-transform: uppercase; font-size: 12px; }
        .hazardous { color: var(--amber); text-shadow: 0 0 5px rgba(255,176,0,0.5); }
        /* Rows fade in when added. */
        @keyframes arrive {
          from { opacity: 0; transform: translateY(-4px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        tbody tr { animation: arrive 0.3s ease-out; }
        /* Data Quality result box. */
        .quality-box { border: 1px solid var(--green); padding: 15px; margin-top: 15px; }
        .reasons { color: var(--amber); }

        /* ================================================================
           GLITCH EFFECTS — a "viewed on a spaceship" feel.
           All pure CSS animations, kept subtle so it reads as a cool
           retro console rather than a broken screen.
           ================================================================ */

        /* (1) A faint flicker of the whole screen's brightness, as if the
           power supply wavers slightly. Most of the time it sits at full
           brightness; it only dips for brief moments. */
        @keyframes flicker {
          0%, 100%   { opacity: 1; }
          92%        { opacity: 1; }
          93%        { opacity: 0.85; }   /* quick dip */
          94%        { opacity: 1; }
          96%        { opacity: 0.92; }   /* smaller second dip */
          97%        { opacity: 1; }
        }
        body { animation: flicker 6s linear infinite; }

        /* (2) A moving scanline that sweeps down the screen, like an old
           CRT refresh. It's a thin brighter band travelling top to bottom. */
        body::after {
          content: "";
          position: fixed;
          left: 0; right: 0;
          height: 80px;
          pointer-events: none;
          z-index: 9998;
          /* A soft green band, brightest in the middle, fading at the edges. */
          background: linear-gradient(
            to bottom,
            transparent,
            rgba(51,255,102,0.06),
            transparent
          );
          animation: sweep 7s linear infinite;
        }
        @keyframes sweep {
          0%   { top: -80px; }        /* start just above the screen */
          100% { top: 100%; }         /* travel to just below it */
        }

        /* (3) An RGB-split "shimmer" on the title, as if the signal isn't
           perfectly aligned. Two coloured copies of the text sit behind it
           and jitter briefly every few seconds.
           We use CSS ::before and ::after on the title, each a copy of the
           text (via the data-text attribute) offset in red and cyan. */
        h1 { position: relative; }
        h1::before, h1::after {
          content: attr(data-text);   /* copy the title text */
          position: absolute;
          left: 0; top: 0;
          width: 100%;
          overflow: hidden;
          /* Only these copies glitch; the real text underneath stays put. */
        }
        h1::before {
          color: #ff003c;             /* red copy */
          animation: glitch-red 5s infinite steps(1);
        }
        h1::after {
          color: #00e5ff;             /* cyan copy */
          animation: glitch-cyan 5s infinite steps(1);
        }
        /* Most of the time the coloured copies are hidden (offset 0, invisible).
           For a split second every cycle they jump sideways and become faintly
           visible — the "glitch" flash. */
        @keyframes glitch-red {
          0%, 100% { transform: translate(0); opacity: 0; }
          42%      { transform: translate(0); opacity: 0; }
          43%      { transform: translate(-2px, 0); opacity: 0.7; }  /* flash */
          44%      { transform: translate(0); opacity: 0; }
        }
        @keyframes glitch-cyan {
          0%, 100% { transform: translate(0); opacity: 0; }
          42%      { transform: translate(0); opacity: 0; }
          43%      { transform: translate(2px, 0); opacity: 0.7; }   /* flash */
          44%      { transform: translate(0); opacity: 0; }
        }

        /* Respect users who prefer reduced motion: turn the glitchy bits off. */
        @media (prefers-reduced-motion: reduce) {
          body { animation: none; }
          body::after { display: none; }
          h1::before, h1::after { display: none; }
        }
    </style>
</head>

<body>

<h1 data-text="NEO TRACKER">NEO TRACKER <span class="cursor"></span></h1>
<p>Near-Earth asteroid data from NASA.</p>

<!-- ======================= TAB BUTTONS ======================= -->
<div class="tabs">
    <button class="tab-button active" id="tabBtnAsteroids">Asteroids</button>
    <button class="tab-button" id="tabBtnQuality">Data Quality</button>
</div>

<!-- ======================= TAB 1: ASTEROIDS ======================= -->
<div class="tab-content visible" id="tabAsteroids">

    <div class="controls">
        Start: <input type="date" id="startDate" value="2026-08-06">
        End:   <input type="date" id="endDate"   value="2026-08-08">
        <button id="fetchButton">Fetch</button>
    </div>

    <div class="filters">
        Filter:
        <label><input type="checkbox" id="filterHazardous"> Hazardous only</label>
        &nbsp;&nbsp;
        Size:
        <select id="filterSize">
            <option value="ALL">All</option>
            <option value="SMALL">Small</option>
            <option value="MEDIUM">Medium</option>
            <option value="LARGE">Large</option>
        </select>
        &nbsp;&nbsp;
        <!-- Checked by default: only show asteroids with an approach in the fetched range. -->
        <label><input type="checkbox" id="filterThisRange" checked> The date range you selected above only</label>
    </div>

    <div id="status">&gt; awaiting command</div>

    <table>
        <thead>
        <tr>
            <th>Object</th>
            <th>Diameter (m)</th>
            <th>Miss Distance (km)</th>
            <th>Approach Date(s)</th>
            <th>Size</th>
            <th>Confidence</th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- ======================= TAB 2: DATA QUALITY ======================= -->
<div class="tab-content" id="tabQuality">
    <p>Inspect an asteroid's confidence rating (with reasons) and change history.</p>

    <!-- Option 1: pick from the dropdown -->
    <div class="controls">
        Asteroid:
        <select id="asteroidPicker">
            <option value="">-- fetch asteroids first --</option>
        </select>
        <button id="inspectButton">Inspect</button>
    </div>

    <!-- Option 2: type a name (partial, case-insensitive) -->
    <div class="controls">
        Or by name:
        <input type="text" id="asteroidNameInput" placeholder="e.g. 2019 LK5">
        <button id="inspectByNameButton">Inspect by name</button>
    </div>

    <div id="qualityStatus"></div>
    <div id="qualityResult"></div>
</div>

<script>
    // ================================================================
    // PART 1: TAB SWITCHING
    // ================================================================
    const tabBtnAsteroids = document.getElementById('tabBtnAsteroids');
    const tabBtnQuality   = document.getElementById('tabBtnQuality');
    const tabAsteroids    = document.getElementById('tabAsteroids');
    const tabQuality      = document.getElementById('tabQuality');

    tabBtnAsteroids.addEventListener('click', function() {
      tabBtnAsteroids.classList.add('active');
      tabBtnQuality.classList.remove('active');
      tabAsteroids.classList.add('visible');
      tabQuality.classList.remove('visible');
    });
    tabBtnQuality.addEventListener('click', function() {
      tabBtnQuality.classList.add('active');
      tabBtnAsteroids.classList.remove('active');
      tabQuality.classList.add('visible');
      tabAsteroids.classList.remove('visible');
    });

    // ================================================================
    // PART 2: FETCHING ASTEROIDS
    // ================================================================
    const fetchButton = document.getElementById('fetchButton');
    const tableBody   = document.getElementById('tableBody');
    const statusLine  = document.getElementById('status');

    // Store the loaded asteroids so filters can re-show them without refetching.
    let allAsteroids = [];
    // Remember the date range we last fetched, for the "this range only" filter.
    let lastStart = '';
    let lastEnd   = '';

    fetchButton.addEventListener('click', loadAsteroids);

    async function loadAsteroids() {
      const start = document.getElementById('startDate').value;
      const end   = document.getElementById('endDate').value;
      lastStart = start;   // remember what we searched
      lastEnd   = end;
      statusLine.textContent = '> querying NASA feed...';

      try {
        const fetchResponse = await fetch(
          '/asteroids/fetch?startDate=' + start + '&endDate=' + end,
          { method: 'POST' }
        );
        if (!fetchResponse.ok) throw new Error('fetch failed, status ' + fetchResponse.status);

        const listResponse = await fetch('/asteroids');
        if (!listResponse.ok) throw new Error('load failed, status ' + listResponse.status);

        allAsteroids = await listResponse.json();
        showFilteredAsteroids();
        fillAsteroidPicker();
        statusLine.textContent = '> feed OK — ' + allAsteroids.length + ' objects stored';

      } catch (error) {
        statusLine.textContent = '> ERROR: ' + error.message;
      }
    }

    // ================================================================
    // PART 3: FILTERING, SORTING, AND BUILDING THE TABLE
    // ================================================================
    document.getElementById('filterHazardous').addEventListener('change', showFilteredAsteroids);
    document.getElementById('filterSize').addEventListener('change', showFilteredAsteroids);
    document.getElementById('filterThisRange').addEventListener('change', showFilteredAsteroids);

    function showFilteredAsteroids() {
      const hazardousOnly = document.getElementById('filterHazardous').checked;
      const sizeWanted    = document.getElementById('filterSize').value;
      const thisRangeOnly = document.getElementById('filterThisRange').checked;

      // Start with all asteroids, then remove ones that don't match each filter.
      let shown = allAsteroids;

      if (hazardousOnly) {
        shown = shown.filter(function(a) { return a.potentiallyHazardous; });
      }
      if (sizeWanted !== 'ALL') {
        shown = shown.filter(function(a) { return a.sizeClass === sizeWanted; });
      }
      // "This range only": keep asteroids that have an approach inside the
      // range we last fetched. (Only applies once we've fetched something.)
      if (thisRangeOnly && lastStart && lastEnd) {
        shown = shown.filter(function(a) { return inRange(a, lastStart, lastEnd); });
      }

      // SORT by earliest approach date (ascending). ISO date strings like
      // "2026-08-06" compare correctly with < and >, so a plain sort gives
      // chronological order. Copy the array first so we don't reorder the source.
      shown = [...shown].sort(function(a, b) {
        const dateA = earliestApproachDate(a);
        const dateB = earliestApproachDate(b);
        if (dateA < dateB) return -1;
        if (dateA > dateB) return 1;
        return 0;
      });

      buildTable(shown);
    }

    function buildTable(asteroids) {
      tableBody.innerHTML = '';   // clear old rows first
      for (const asteroid of asteroids) {
        const missDistance = nearestMiss(asteroid);
        const row = document.createElement('tr');
        if (asteroid.potentiallyHazardous) row.className = 'hazardous';
        row.innerHTML =
          '<td>' + asteroid.name + '</td>' +
          '<td>' + Math.round(asteroid.estimatedDiameterMinMeters) +
              ' - ' + Math.round(asteroid.estimatedDiameterMaxMeters) + '</td>' +
          '<td>' + Math.round(missDistance).toLocaleString() + '</td>' +
          '<td>' + approachDates(asteroid) + '</td>' +
          '<td>' + (asteroid.sizeClass || '-') + '</td>' +
          '<td>' + (asteroid.confidenceRating || '-') + '</td>';
        tableBody.appendChild(row);
      }
    }

    // Helper: smallest miss distance among an asteroid's approaches.
    function nearestMiss(asteroid) {
      if (!asteroid.closeApproaches || asteroid.closeApproaches.length === 0) return 0;
      let smallest = asteroid.closeApproaches[0].missDistanceKm;
      for (const approach of asteroid.closeApproaches) {
        if (approach.missDistanceKm < smallest) smallest = approach.missDistanceKm;
      }
      return smallest;
    }

    // Helper: all approach dates as a comma-separated string.
    function approachDates(asteroid) {
      if (!asteroid.closeApproaches || asteroid.closeApproaches.length === 0) return '-';
      return asteroid.closeApproaches
        .map(function(approach) { return approach.approachDate; })
        .join(', ');
    }

    // Helper: earliest approach date (used for sorting). Date-less asteroids
    // get "9999" so they sort to the bottom.
    function earliestApproachDate(asteroid) {
      if (!asteroid.closeApproaches || asteroid.closeApproaches.length === 0) return '9999';
      let earliest = asteroid.closeApproaches[0].approachDate;
      for (const approach of asteroid.closeApproaches) {
        if (approach.approachDate < earliest) earliest = approach.approachDate;
      }
      return earliest;
    }

    // Helper: does this asteroid have at least one approach within [start, end]?
    function inRange(asteroid, start, end) {
      if (!asteroid.closeApproaches) return false;
      return asteroid.closeApproaches.some(function(approach) {
        return approach.approachDate >= start && approach.approachDate <= end;
      });
    }

    // ================================================================
    // PART 4: DATA QUALITY TAB
    // ================================================================
    const asteroidPicker = document.getElementById('asteroidPicker');
    const inspectButton  = document.getElementById('inspectButton');
    const qualityStatus  = document.getElementById('qualityStatus');
    const qualityResult  = document.getElementById('qualityResult');

    function fillAsteroidPicker() {
      asteroidPicker.innerHTML = '';
      for (const asteroid of allAsteroids) {
        const option = document.createElement('option');
        option.value = asteroid.id;
        option.textContent = asteroid.name;
        asteroidPicker.appendChild(option);
      }
    }

    const asteroidNameInput   = document.getElementById('asteroidNameInput');
    const inspectByNameButton = document.getElementById('inspectByNameButton');

    // ENTRY POINT 1: the dropdown gives us an id directly.
    inspectButton.addEventListener('click', function() {
      const id = asteroidPicker.value;
      if (!id) {
        qualityStatus.textContent = '> fetch asteroids first, then pick one';
        return;
      }
      inspectById(id);
    });

    // ENTRY POINT 2: the text field gives us a name; we find its id.
    inspectByNameButton.addEventListener('click', function() {
      const typed = asteroidNameInput.value.trim().toLowerCase();
      if (!typed) {
        qualityStatus.textContent = '> type an asteroid name first';
        return;
      }
      // Search the loaded asteroids for one whose name contains what was typed
      // (case-insensitive partial match). Returns the first match, or undefined.
      const match = allAsteroids.find(function(a) {
        return a.name.toLowerCase().includes(typed);
      });
      if (!match) {
        qualityStatus.textContent = '> no stored asteroid matches "' + asteroidNameInput.value + '"';
        return;
      }
      inspectById(match.id);
    });

    // Shared logic: given an asteroid id, load its quality + history and show them.
    // Both the dropdown and the name field funnel into this one function.
    async function inspectById(id) {
      qualityStatus.textContent = '> loading...';
      qualityResult.innerHTML = '';
      try {
        const qualityResponse = await fetch('/asteroids/' + id + '/quality');
        if (!qualityResponse.ok) throw new Error('quality request failed, status ' + qualityResponse.status);
        const quality = await qualityResponse.json();

        const historyResponse = await fetch('/asteroids/' + id + '/history');
        if (!historyResponse.ok) throw new Error('history request failed, status ' + historyResponse.status);
        const history = await historyResponse.json();

        showQuality(quality, history);
        qualityStatus.textContent = '';
      } catch (error) {
        qualityStatus.textContent = '> ERROR: ' + error.message;
      }
    }

    function showQuality(quality, history) {
      let reasonsText = 'No issues found.';
      if (quality.reasons && quality.reasons.length > 0) {
        reasonsText = quality.reasons.join('; ');
      }
      let historyText = 'No changes recorded.';
      if (history.length > 0) {
        historyText = '';
        for (const change of history) {
          historyText += change.fieldName + ': ' + change.oldValue +
                         ' -> ' + change.newValue + ' (' + change.changeType + ')<br>';
        }
      }
      qualityResult.innerHTML =
        '<div class="quality-box">' +
          '<strong>' + quality.asteroidName + '</strong><br><br>' +
          'Confidence: ' + quality.confidenceRating + '<br>' +
          'Notes: <span class="reasons">' + reasonsText + '</span><br><br>' +
          'Change history:<br>' + historyText +
        '</div>';
    }
</script>

</body>
</html>
